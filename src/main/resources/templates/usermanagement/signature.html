<script>
    function previewImage(event) {
        const file = event.target.files[0]; // Get the selected file
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // Show Image Preview
                const preview = document.getElementById("preview");
                preview.src = e.target.result;
                preview.style.display = "block";

                // Show Success Message
                document.getElementById("successMessageContainer").style.display = "block";

                // Show Refresh Button
                document.getElementById("refreshButton").style.display = "block";
            };
            reader.readAsDataURL(file);
        }
    }

    function clearFileInput() {
        // Reset File Input
        document.getElementById("fileInput").value = "";

        // Hide Preview
        document.getElementById("preview").style.display = "none";

        // Hide Success Message
        document.getElementById("successMessageContainer").style.display = "none";

        // Hide Refresh Button
        document.getElementById("refreshButton").style.display = "none";
    }

    function refreshPage() {
        location.reload(); // Reload the page to reset everything
    }
</script>

    function adjustHeight(el) {
        el.style.height = 'auto'; 
        el.style.height = (el.scrollHeight) + 'px';

    $(document).ready(function () {
    	 $('.close').click(function() {
 	        $('#editModal').modal('hide');

            event.preventDefault();

            const file = fileInput.files[0];

            }
            document.getElementById("fileInput").addEventListener("change", function () {

            });
        });

    function uploadFile() {
    	
        const fileInput = document.getElementById("fileInput");
        const file = fileInput.files[0];
        const maxFileSize = 1 * 1024 * 1024; 
        const responseMessage = document.getElementById("responseMessage");
   
        responseMessage.innerText = "";
        responseMessage.style.color = "green";

   
        if (!file) {
            responseMessage.innerText = "Please select a file to upload.";
            responseMessage.style.color = "red";
            return;
        }
        if (file.size > maxFileSize) {
            responseMessage.innerText = "File size exceeds 1 MB. Please select a smaller file.";
            responseMessage.style.color = "red";
            return;
        }

        const formData = new FormData();
        
        formData.append("file", file);
     

        responseMessage.innerText = "Uploading file, please wait...";
        responseMessage.style.color = "blue";
   
        $.ajax({
            url: './api/uploadNewsOrFile',
            type: 'POST',
            data: formData,
            contentType: false,
            processData: false,
            success: function () {
                responseMessage.innerText = "File uploaded successfully!";
                responseMessage.style.color = "green";

                document.getElementById("successMessage").innerText = "Upload successful!";
                document.getElementById("successMessageContainer").style.display = "block";

                setTimeout(() => {
                    document.getElementById("successMessageContainer").style.display = "none";
                }, 5000);

                fileInput.value = ""; // Clear file input
                document.getElementById("message").value = ""; // Clear message input
                document.getElementById("refreshButton").style.display = "none"; // Hide refresh button
                fetchAlerts(); // Refresh alerts
            },
            error: function () {
                responseMessage.innerText = "File submission failed. Please try again.";
                responseMessage.style.color = "red";
            }
        });
    }

    function exportToExcel() {
        var table = document.getElementById('alertsTable');
        var rows = table.rows;
        var csv = [];

        for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var cells = row.getElementsByTagName('td');
            var rowData = [];
            for (var j = 0; j < cells.length; j++) {
                rowData.push(cells[j].innerText);
            }
            csv.push(rowData.join(','));
        }


        var csvString = csv.join('\n');
        var blob = new Blob([csvString], { type: 'text/csv' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'farmer_alerts.csv';
        link.click();
    }
    
    function printTable() {
        var printContents = document.getElementById('alertsTable').outerHTML;
        var originalContents = document.body.innerHTML;

        document.body.innerHTML = printContents;
        window.print();
        document.body.innerHTML = originalContents;
    }
 
   
    function addNewAlert(message) {
        var data = { message: message };
        $.ajax({
            type: 'POST',
            url: './api/addNewAlert',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function () {
                document.getElementById("successMessage").innerText = "Message added successfully!";
                document.getElementById("successMessageContainer").style.display = "block";

                setTimeout(() => {
                    document.getElementById("successMessageContainer").style.display = "none";
                }, 5000);

                $('#message').val(""); // Clear the input field
                fetchAlerts(); // Refresh the alerts table
            },
            error: function () {
                alert('Failed to add message.');
            }
        });
    }
    
 function saveNewsAlert() {
        const updatedMessage = $('#editMessage').val();
        const rowId = $('#editRowId').val();
        var data = {
            slno: rowId,
            news: updatedMessage
        };
        $.ajax({
            type: 'POST',
            url: './utilMao/updateNewAlerts',
            contentType: 'application/json',
            data: JSON.stringify(data),  // Send slno and message as JSON
            success: function () {
                alert('Message updated successfully!');
                $(`#msg_${rowId}`).text(updatedMessage);
                $('#editModal').modal('hide');
            },
            error: function () {
                alert('Failed to update message.');
            }
        });
    }

    function openEditModal(slno, message) {
        $('#editRowId').val(slno);
        $('#editMessage').val(message);
        $('#editModal').modal('show');
    }

    function deleteAlerts(slno) {
        if (confirm('Are you sure you want to delete this message?')) {
            $.ajax({
                type: 'POST',
                url: './utilMao/deleteAlerts',
                contentType: 'application/json',
                data: JSON.stringify(slno),
                success: function () {
                    alert('Alerts deleted successfully!');
                    $(`#row_${slno}`).remove();
                },
                error: function () {
                    alert('Failed to delete alerts.');
                }
            });
        }
    }
    
    function clearFileInput() {
        document.getElementById("fileInput").value = ""; // Clear the file input
        document.getElementById("refreshButton").style.display = "none"; // Hide refresh button
    }
