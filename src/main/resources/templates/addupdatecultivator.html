<div class="panel-group">
	<div class="panel panel-primary">
		<div class="panel-heading">Owner Data</div>
		<div class="panel-body">

			<table id="ownerGrid" class="table table-bordered table-striped dataTable">
				<thead class="color-palette" style="background-color: #9494b8;">
					<tr>
						<td style="width:10%;background-color: #9494b8;">Booking Id</th>
						<td style="width:10%;background-color: #9494b8;">Survey No</th>
						<td style="width:10%;background-color: #9494b8;">Khata No</th>
						<td style="width:12%;background-color: #9494b8;">Pattadhar Name</th>
						<td style="width:12%;background-color: #9494b8;">Pattadhar Father Name</th>
						<td style="width:10%;background-color: #9494b8;">Aadhar No</th>
						<td style="width:10%;background-color: #9494b8;">Occupant Extent</th>
						<td style="width:12%;background-color: #9494b8;">Actions</th>
					</tr>
				</thead>
				<tbody>
					<tr th:id="${cultivator.bookingId}" th:each="cultivator:${ownersList}">

						<td style="width:10%;">
							<span th:text="${cultivator.bookingId}"></span>
							<input type="hidden" th:value="${cultivator.bookingId}"
								th:id="'bookingId'+${cultivatorStat.index}">
							<input type="hidden" th:value="${cultivator.part_key}"
								th:id="'part_key'+${cultivatorStat.index}">

							<input type="hidden" th:value="${cultivator.cr_vcode}"
								th:id="'cr_vcode'+${cultivatorStat.index}">
							<input type="hidden" th:value="${cultivator.cr_year}"
								th:id="'cr_year'+${cultivatorStat.index}">
							<input type="hidden" th:value="${cultivator.cr_season}"
								th:id="'cr_season'+${cultivatorStat.index}">

						</td>
						<td style="width:10%;">
							<span th:text="${cultivator.crSno}"></span>
							<input type="hidden" th:value="${cultivator.crSno}" th:id="'crSno'+${cultivatorStat.index}">
						</td>
						<td style="width:10%;">
							<span th:text="${cultivator.khNo}"></span>
							<input type="hidden" th:value="${cultivator.khNo}" th:id="'khNo'+${cultivatorStat.index}">
						</td>
						<td style="width:12%;">
							<span th:text="${cultivator.ocName}"></span>
							<input type="hidden" th:value="${cultivator.ocName}"
								th:id="'ocName'+${cultivatorStat.index}">
						</td>
						<td style="width:12%;">
							<span th:text="${cultivator.fatherName}"></span>
							<input type="hidden" th:value="${cultivator.fatherName}"
								th:id="'fatherName'+${cultivatorStat.index}">
						</td>
						<td style="width:10%;">
							<input style="width: 150pX;" type="text" th:value="${cultivator.aadharNo}"
								th:id="'aadharNo'+${cultivatorStat.index}" class="form-control" disabled>
						</td>
						<td style="width:10%;">
							<input style="width: 150pX;" type="text" th:value="${cultivator.occupantExtent}"
								th:id="'occupantExtent'+${cultivatorStat.index}" class="form-control" disabled>
						</td>
						<td style="width:12%;">
							<div class="row">
								<div class="col-md-8">
									<div class="form-group" style="margin-bottom: 5px;">
										<div class="input-group">
											<div style="margin: 0 auto; width: 155px; color: #000;">
												<select th:id="'searchParam'+${cultivatorStat.index}"
													style="width: 100px" class="form-control"
													th:onchange="onUserTypeChange([[${cultivatorStat.index}]], this.value)">
													<option value="0" selected>--Select--</option>
													<option value="1">Owner</option>
													<option value="2">Cultivator
													</option>
													<option value="3">Enjoyer</option>
												</select>
											</div>
										</div>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group" style="margin-bottom: 5px;">
										<div class="input-group">
											<div style="margin: 0 auto; width: 155px; color: #000;">
												<i class="fa fa-save fa-2x fa-pull-left"
													th:id="'update'+${cultivatorStat.index}"
													th:onclick="updateCultivatorOwnerDetails([[${cultivatorStat.index}]])"
													style="padding: 0px;padding-top: 4px;display:none;"></i>
											</div>
										</div>
									</div>
								</div>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>

	<div class="panel panel-primary">
		<div class="panel-heading">Cultivator Data</div>
		<div class="panel-body">

			<table id="cultivatorGrid" class="table table-bordered table-striped dataTable">
				<thead class="color-palette" style="background-color: #9494b8;">
					<tr>
						<td style="width:10%;background-color: #9494b8;">Booking Id</th>
						<td style="width:10%;background-color: #9494b8;">Survey No</th>
						<td style="width:10%;background-color: #9494b8;">Khata No</th>
						<td style="width:12%;background-color: #9494b8;">Pattadhar Name</th>
						<td style="width:12%;background-color: #9494b8;">Pattadhar Father Name</th>
						<td style="width:10%;background-color: #9494b8;">Aadhar No</th>
						<td style="width:10%;background-color: #9494b8;">Occupant Extent</th>
						<td style="width:12%;background-color: #9494b8;">Actions</th>
					</tr>
				</thead>
				<tbody>
					<tr th:id="${cultivator.bookingId}" th:each="cultivator:${cultivatorsList}">

						<td style="width:10%;">
							<span th:text="${cultivator.bookingId}"></span>
							<input type="hidden" th:value="${cultivator.bookingId}"
								th:id="'bookingId_c'+${cultivatorStat.index}">
							<input type="hidden" th:value="${cultivator.part_key}"
								th:id="'part_key_c'+${cultivatorStat.index}">

							<input type="hidden" th:value="${cultivator.cr_vcode}"
								th:id="'cr_vcode_c'+${cultivatorStat.index}">
							<input type="hidden" th:value="${cultivator.cr_year}"
								th:id="'cr_year_c'+${cultivatorStat.index}">
							<input type="hidden" th:value="${cultivator.cr_season}"
								th:id="'cr_season_c'+${cultivatorStat.index}">

						</td>
						<td style="width:10%;">
							<span th:text="${cultivator.crSno}"></span>
							<input type="hidden" th:value="${cultivator.crSno}"
								th:id="'crSno_c'+${cultivatorStat.index}">
						</td>
						<td style="width:10%;">
							<span th:text="${cultivator.khNo}"></span>
							<input type="hidden" th:value="${cultivator.khNo}" th:id="'khNo_c'+${cultivatorStat.index}">
						</td>
						<td style="width:12%;">
							<span th:text="${cultivator.ocName}"></span>
							<input type="hidden" th:value="${cultivator.ocName}"
								th:id="'ocName_c'+${cultivatorStat.index}">
						</td>
						<td style="width:12%;">
							<span th:text="${cultivator.fatherName}"></span>
							<input type="hidden" th:value="${cultivator.fatherName}"
								th:id="'fatherName_c'+${cultivatorStat.index}">
						</td>
						<td style="width:10%;">
							<input style="width: 150pX;" type="text" th:value="${cultivator.aadharNo}"
								th:id="'aadharNo_c'+${cultivatorStat.index}" class="form-control" disabled>
						</td>
						<td style="width:10%;">
							<input style="width: 150pX;" type="text" th:value="${cultivator.occupantExtent}"
								th:id="'occupantExtent_c'+${cultivatorStat.index}" class="form-control" disabled>
						</td>
						<td style="width:12%;">
							<div class="row">
								<div class="col-md-4">
									<div class="form-group" style="margin-bottom: 5px;">
										<div class="input-group">
											<div style="margin: 0 auto; width: 155px; color: #000;">
												<i class="fa fa-edit fa-2x fa-pull-left"
													th:id="'edit_c'+${cultivatorStat.index}"
													th:onclick="editCultivatorTenantDetails('_c[[${cultivatorStat.index}]]')"
													style="padding: 0px;padding-top: 4px;"></i>
											</div>
										</div>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group" style="margin-bottom: 5px;">
										<div class="input-group">
											<div style="margin: 0 auto; width: 155px; color: #000;">
												<i class="fa fa-save fa-2x fa-pull-left"
													th:id="'update_c'+${cultivatorStat.index}"
													th:onclick="updateCultivatorTenantDetails('_c[[${cultivatorStat.index}]]')"
													style="padding: 0px;padding-top: 4px;display:none;"></i>
											</div>
										</div>
									</div>
								</div>
								<div class="col-md-4">
									<div class="form-group" style="margin-bottom: 5px;">
										<div class="input-group">
											<div style="margin: 0 auto; width: 155px; color: #000;">
												<i class="fa fa-trash-o fa-2x fa-pull-left"
													th:id="'delete_c'+${cultivatorStat.index}"
													th:onclick="deleteCultivatorTenantDetails('_c[[${cultivatorStat.index}]]')"
													style="padding: 0px;padding-top: 4px;"></i>
											</div>
										</div>
									</div>
								</div>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
<script type="text/javascript">
	$(document).ready(function () {

		new DataTable('#cultivatorGrid');

	});
</script>
