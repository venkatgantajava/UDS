height: 100%;

}

button[type="submit"] {
    margin-top: 20px; /* Increase the space */
    background-color: #be6c0f;

}

        color:white;

	<script>jQuery(document).ready(function ($) {
			$('img').removeAttr('width height');
		});


	</script>
	
	<script src="/script/validations.js" language="javascript"></script>
	<script language="javascript" src="./js/jquery1/md5_1.js"></script>
	<script language="javascript" src="./js/sha256.js"></script>

	<script type="text/javascript">

		function changePass() {
			var password = $("#password").val();
			var pass1 = GM(GM(password));
			var sha256 = new jsSHA('SHA-256', 'TEXT');
			sha256.update(pass1);
			var pass2 = sha256.getHash("HEX");
			$("#password").val(pass2);
		}

		
		function getCaptch() {
			$.ajax({
				type: "GET",
				url: 'captcha/get',
				success: function (responseData) {
	
					$("#capt").val(responseData.captcha);
					
				}
			});
		}
		
		
	</script>
</head>
<body>
<div>
    <div class="header">
        <img src="./images/headfarm.jpg" class="img-fluid ">
    </div>
<div class="container">
  
    <div class="row ">
        <div class="col-lg-6"></div>
           
        <div class="col-lg-6 form">
          
            <div class="form-container">
               
               <form th:action="@{/login}" th:object="${appuser}" method="post" autocomplete="off">
					<input type="hidden" name="shapassword" id="shapassword" />
					<div class="mb-3">
						<input type="text" class="form-control" th:name="username" th:placeholder="Username" required
							autocomplete="off" style=" border-radius: 20px;">
					</div>
					<div class="mb-3">
						<input type="password" class="form-control" name="password" id="password"
							th:placeholder="Password" required autocomplete="off" style=" border-radius: 20px;" onchange="changePass()">
					</div>

					<label>
						 <div class="form-group mb-3">
		            	<span th:utext="${usercaptcha}"></span><br>
		            	
						<input type="text" th:field="*{answer}"  id="answer" autocomplete="off" name="answer" class="form-control hero-subscribe-from"/>
						  <span   class="error" th:if="${#fields.hasErrors('answer')}" th:errors="*{answer}" style="color: red;" ></span>   
                        <span id="answer-error"  class="error"></span>  
		            </div>

					<br>
					<div class="form-group">
						<input type="submit" class="btn btn-lg btn-success btn-block" value="submit"/>
						 <!--  onclick="validcap(event)" -->


					</div>

					<div>
						<span th:utext="${msg}"></span>
					</div>
				</form>
          
        </div>
    </div>
</div>
</div>
<footer class="footer text-white text-center py-3">
    <p >Designed and Developed by NIC</p>
</footer>
</div>
