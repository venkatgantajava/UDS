	<script>jQuery(document).ready(function ($) {

	<script src="./script/validations.js" language="javascript"></script>
	<script language="javascript" src="./js/jquery1/md5_1.js"></script>
	<script language="javascript" src="./js/sha256.js"></script>

	<script type="text/javascript">

		function changePass() {
			var password = $("#password").val();
			var pass1 = GM(GM(password));
			var sha256 = new jsSHA('SHA-256', 'TEXT');
			sha256.update(pass1);
			var pass2 = sha256.getHash("HEX");
			$("#password").val(pass2);
		}

		
		function getCaptch() {
			$.ajax({
				type: "GET",
				url: 'captcha/get',
				success: function (responseData) {
	
					$("#capt").val(responseData.captcha);
					
				}
			});
		}
		
		
	</script>
